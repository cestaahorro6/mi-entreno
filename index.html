<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1324">
  <meta name="description" content="Entrenos, peso y Excel desde tu iPhone, sin cuentas, sincronización ni servidor de datos.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Entreno">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Mi Entreno iPhone — Excel offline</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="#inicio" class="brand" aria-label="Mi Entreno, ir a inicio">
        <span class="brand-icon" aria-hidden="true">↗</span>
        <span>MI<span class="brand-light">ENTRENO</span><small>OFFLINE</small></span>
      </a>
      <div class="topbar-actions">
        <span id="save-indicator" class="save-indicator"><span class="status-dot"></span> Guardado</span>
        <button class="excel-top" id="top-export-excel" type="button" aria-label="Guardar copia Excel en Archivos">⇩ <span>Excel</span></button>
        <a class="top-icon" href="#ajustes" aria-label="Copias de seguridad y ajustes" title="Copias de seguridad">⚙</a>
      </div>
    </header>
    <main id="app" tabindex="-1" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Navegación principal">
      <a href="#inicio" data-nav="inicio" class="nav-item"><span class="nav-emoji">⌂</span><span>Inicio</span></a>
      <a href="#entrenos" data-nav="entrenos" class="nav-item"><span class="nav-emoji">▦</span><span>Rutinas</span></a>
      <a href="#peso" data-nav="peso" class="nav-item"><span class="nav-emoji">⚖</span><span>Peso</span></a>
      <a href="#progreso" data-nav="progreso" class="nav-item"><span class="nav-emoji">⌁</span><span>Progreso</span></a>
      <a href="#ajustes" data-nav="ajustes" class="nav-item"><span class="nav-emoji">⚙</span><span>Ajustes</span></a>
    </nav>
  </div>
  <input id="backup-import" type="file" accept=".json,application/json" hidden>
  <input id="excel-import" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./seed.js"></script>
  <script src="./excel.js"></script>
  <script src="./app.js"></script>
</body>
</html>
